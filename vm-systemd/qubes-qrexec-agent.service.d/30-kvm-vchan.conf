[Unit]
# On KVM/xen-shim, don't depend on Xen driver domain service
After=qubes-vchan-env.service qubes-db.service
Wants=qubes-vchan-env.service

[Service]
# Override: on KVM, skip the xen_evtchn modprobe (there is no
# /dev/xen/evtchn). The original ExecStartPre is cleared and
# replaced with a no-op that succeeds on both Xen and KVM.
ExecStartPre=
ExecStartPre=+/bin/sh -c 'if [ -e /dev/xen/evtchn ]; then true; elif [ -e /dev/vsock ] || [ -e /dev/virtio-ports/org.qubes-os.qubesdb ]; then true; else modprobe xen_evtchn 2>/dev/null || true; fi'
EnvironmentFile=-/run/qubes/vchan.env
